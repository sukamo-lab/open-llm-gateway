apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: llm-gateway-secrets
spec:
  refreshInterval: 1h
  secretStoreRef: {name: production, kind: ClusterSecretStore}
  target: {name: llm-gateway-secrets, creationPolicy: Owner}
  data:
    - secretKey: LLM_GATEWAY_ADMIN_KEY
      remoteRef: {key: llm-gateway/admin-key}
    - secretKey: LLM_GATEWAY_DATABASE
      remoteRef: {key: llm-gateway/database-url}
    - secretKey: OPENAI_API_KEY
      remoteRef: {key: llm-gateway/openai-api-key}

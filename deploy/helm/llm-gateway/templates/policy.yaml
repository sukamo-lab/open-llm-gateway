{{- if .Values.podDisruptionBudget.enabled }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: {name: {{ include "llm-gateway.name" . }}}
spec:
  minAvailable: {{ .Values.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels: {{- include "llm-gateway.labels" . | nindent 6 }}
{{- end }}
{{- if .Values.networkPolicy.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: {{ include "llm-gateway.name" . }}}
spec:
  podSelector:
    matchLabels: {{- include "llm-gateway.labels" . | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
{{ toYaml .Values.networkPolicy.ingressNamespaceSelector | nindent 12 }}
      ports:
        - {protocol: TCP, port: 8000}
  egress:
    - to: [{namespaceSelector: {}}]
      ports: [{protocol: UDP, port: 53}, {protocol: TCP, port: 53}]
    {{- range .Values.networkPolicy.egressCIDRs }}
    - to: [{ipBlock: {cidr: {{ . | quote }}}}]
      ports: [{protocol: TCP, port: 443}]
    {{- end }}
{{- end }}

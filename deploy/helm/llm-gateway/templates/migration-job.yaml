{{- if .Values.migrations.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: "{{ include "llm-gateway.name" . }}-migrate-{{ .Release.Revision }}"
  annotations: {"helm.sh/hook": pre-install,pre-upgrade, "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded}
spec:
  backoffLimit: 3
  template:
    spec:
      restartPolicy: OnFailure
      serviceAccountName: {{ include "llm-gateway.name" . }}
      containers:
        - name: migrate
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          args: ["--config", "/etc/llm-gateway/config.yaml", "--migrate"]
          envFrom: [{secretRef: {name: {{ .Values.secrets.existingSecret }}}}]
          volumeMounts: [{name: config, mountPath: /etc/llm-gateway, readOnly: true}]
          securityContext: {{- toYaml .Values.securityContext | nindent 12 }}
      volumes: [{name: config, configMap: {name: {{ .Values.config.existingConfigMap }}}}]
{{- end }}

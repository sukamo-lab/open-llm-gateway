apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "llm-gateway.name" . }}
  labels: {{- include "llm-gateway.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels: {{- include "llm-gateway.labels" . | nindent 6 }}
  template:
    metadata:
      labels: {{- include "llm-gateway.labels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "llm-gateway.name" . }}
      securityContext: {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: gateway
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["--config", "/etc/llm-gateway/config.yaml"]
          ports: [{name: http, containerPort: 8000}]
          envFrom: [{secretRef: {name: {{ .Values.secrets.existingSecret }}}}]
          volumeMounts:
            - {name: config, mountPath: /etc/llm-gateway, readOnly: true}
            - {name: tmp, mountPath: /tmp}
          readinessProbe: {httpGet: {path: /ready, port: http}, periodSeconds: 10}
          livenessProbe: {httpGet: {path: /health, port: http}, periodSeconds: 20}
          securityContext: {{- toYaml .Values.securityContext | nindent 12 }}
          resources: {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: config
          configMap: {name: {{ .Values.config.existingConfigMap }}}
        - name: tmp
          emptyDir: {sizeLimit: 128Mi}

mode: multi
# Use a PostgreSQL DSN for multiple replicas; the file path is ideal for local use.
database: ${LLM_GATEWAY_DATABASE:-./data/gateway.db}

features:
  authentication: true
  admin_api: true
  managed_keys: true
  tenant_quotas: true
  provider_quotas: true
  usage_accounting: true
  cost_tracking: true
  metrics: true
  circuit_breaker: true
  structured_logging: true
  idempotency: true
  # Opt in after selecting retention and a backend appropriate for your deployment.
  exact_cache: false
  tracing: false
  pii_detection: false
  moderation: false
  prompt_injection: false
  responses_api: false
  embeddings_api: false

server:
  host: 0.0.0.0
  port: 8000
  docs_enabled: true
  cors_origins: []

auth:
  api_keys_env: LLM_GATEWAY_API_KEYS
  admin_key_env: LLM_GATEWAY_ADMIN_KEY
  # Use 0 for immediate cross-replica revocation, or a few seconds for lower latency.
  key_cache_seconds: 5
  key_cache_max_entries: 10000

routing:
  # 0 tries every eligible provider. Paid providers always sort after free ones.
  max_attempts: 0
  allow_provider_override: false
  paid_fallback: true
  http_max_connections: 200
  http_max_keepalive_connections: 50
  http_keepalive_expiry_seconds: 30
  # 1 preserves immediate provider failover. Increase for transient same-provider retries.
  retry_attempts: 1
  retry_initial_backoff_seconds: 0.25
  retry_max_backoff_seconds: 8
  retry_jitter_ratio: 0.2
  # Optional end-to-end deadline across retries for one provider candidate.
  request_deadline_seconds: null

observability:
  # Keep vendor response details out of public 503 errors in production.
  include_upstream_errors: false
  log_requests: true
  log_provider_attempts: true
  log_health_checks: false
  # Stack traces may contain provider/library details; disabled for safe defaults.
  include_exception_stacktraces: false
  http_latency_buckets_seconds: [0.005, 0.01, 0.025, 0.05, 0.1, 0.25, 0.5, 1, 2.5, 5, 10]
  provider_latency_buckets_seconds: [0.05, 0.1, 0.25, 0.5, 1, 2.5, 5, 10, 30, 60, 120]

accounting:
  retention_days: 90

idempotency:
  ttl_seconds: 86400
  lease_seconds: 180
  wait_timeout_seconds: 30
  poll_interval_seconds: 0.1
  max_response_bytes: 10485760
  min_key_length: 8
  max_key_length: 255

cache:
  # memory is fastest for one process; database or redis coordinates replicas.
  backend: memory
  ttl_seconds: 3600
  max_entries: 10000
  max_response_bytes: 10485760
  namespace: v1
  allow_client_bypass: true
  failure_mode: open
  redis_url_env: LLM_GATEWAY_REDIS_URL
  redis_prefix: "llm-gateway:exact"

telemetry:
  # OTEL_EXPORTER_OTLP_TRACES_ENDPOINT defaults to the SDK's local collector endpoint.
  endpoint_env: OTEL_EXPORTER_OTLP_TRACES_ENDPOINT
  sample_ratio: 1.0
  export_timeout_seconds: 10
  max_queue_size: 2048
  max_export_batch_size: 512
  schedule_delay_millis: 5000
  excluded_paths: [/health, /ready]
  # Tenant identifiers are excluded from traces unless explicitly required.
  include_tenant_id: false
  failure_mode: open

pii:
  # Optional local policy stage; no prompt content is sent to another service.
  action: redact
  scan: input
  detectors: [email, phone, credit_card, us_ssn]
  replacement: "[REDACTED:{type}]"
  max_scan_characters: 1000000
  failure_mode: closed
  # Output scanning cannot safely transform an SSE stream without buffering it.
  streaming_output: block

moderation:
  # Local conservative rules; monitor first and tune before enabling blocking.
  action: monitor
  scan: input
  categories: [hate, harassment, self_harm, sexual, violence]
  custom_terms: []
  max_scan_characters: 1000000
  failure_mode: closed
  streaming_output: block

prompt_injection:
  # Heuristic risk signal only; begin with score or warn and calibrate locally.
  action: warn
  threshold: 0.5
  signals: [instruction_override, secret_exfiltration, role_override, tool_manipulation, encoding_evasion]
  scan_roles: [user, tool]
  max_scan_characters: 1000000
  failure_mode: closed

responses:
  max_input_items: 1000
  max_tools: 128
  max_metadata_entries: 16

embeddings:
  max_inputs: 2048
  max_input_characters: 1000000
  max_token_ids: 1000000
  max_dimensions: 65536
  allow_token_arrays: true

providers:
  - name: google-free
    base_url: https://generativelanguage.googleapis.com/v1beta/openai
    api_key_env: GOOGLE_API_KEY
    tier: free
    max_concurrency: 5
    failure_threshold: 3
    cooldown_seconds: 60
    limits:
      # Replace with the limits shown for your Google project.
      - { requests: 10, window_seconds: 60 }
    models:
      - name: fast
        upstream_model: gemini-2.5-flash
        priority: 10
        capabilities: [chat, vision, tools, json]
      - name: reasoning
        upstream_model: gemini-2.5-flash
        reasoning: true
        priority: 10
        capabilities: [chat, reasoning, vision, tools, json]

  - name: openai-paid
    base_url: https://api.openai.com/v1
    api_key_env: OPENAI_API_KEY
    tier: paid
    max_concurrency: 20
    limits:
      # Example rolling account safety budget; adjust to your organization.
      - { cost_usd: 50, window_seconds: 2592000 }
    models:
      - name: fast
        upstream_model: gpt-4.1-mini
        priority: 10
        capabilities: [chat, vision, tools, json]
        input_cost_per_million: 0.40
        output_cost_per_million: 1.60
      - name: reasoning
        upstream_model: o4-mini
        reasoning: true
        priority: 10
        capabilities: [chat, reasoning, vision, tools, json]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "llm-gateway"
version = "0.10.0"
description = "OpenAI-compatible, quota-aware LLM routing gateway"
readme = "README.md"
license = "Apache-2.0"
keywords = ["llm", "gateway", "openai", "routing", "observability"]
requires-python = ">=3.11"
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Web Environment",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Internet :: Proxy Servers",
  "Topic :: Software Development :: Libraries :: Application Frameworks",
]
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.5,<3",
  "PyYAML>=6,<7",
  "uvicorn[standard]>=0.30,<1",
  "asyncpg>=0.30,<1",
  "redis>=5,<7",
  "opentelemetry-api>=1.45.1,<2",
  "opentelemetry-sdk>=1.27,<2",
  "opentelemetry-exporter-otlp-proto-http>=1.27,<2",
]

[project.optional-dependencies]
oidc = ["PyJWT[crypto]>=2.10,<3"]
security = ["cryptography>=43,<47"]
dev = [
  "build>=1.2,<2",
  "pytest>=8,<9",
  "pytest-asyncio>=0.24,<1",
  "ruff>=0.8,<1",
  "openai>=1.75,<3",
]

[project.scripts]
llm-gateway = "llm_gateway.cli:main"
llm-gateway-admin = "llm_gateway.admin_cli:main"

[project.urls]
Homepage = "https://github.com/sukamo-lab/open-llm-gateway"
Documentation = "https://github.com/sukamo-lab/open-llm-gateway/tree/main/docs"
Issues = "https://github.com/sukamo-lab/open-llm-gateway/issues"
Changelog = "https://github.com/sukamo-lab/open-llm-gateway/blob/main/CHANGELOG.md"
Source = "https://github.com/sukamo-lab/open-llm-gateway"

[tool.hatch.build.targets.wheel]
packages = ["src/llm_gateway"]

[tool.hatch.build.targets.sdist]
include = [
  "/.dockerignore",
  "/.env.example",
  "/.github",
  "/.gitignore",
  "/CHANGELOG.md",
  "/CODE_OF_CONDUCT.md",
  "/CONTRIBUTING.md",
  "/Dockerfile",
  "/GOVERNANCE.md",
  "/LICENSE",
  "/README.md",
  "/SECURITY.md",
  "/SUPPORT.md",
  "/config.example.yaml",
  "/deploy",
  "/docker-compose.postgres.yml",
  "/docker-compose.yml",
  "/docs",
  "/pyproject.toml",
  "/requirements",
  "/scripts",
  "/src",
  "/tests",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--strict-markers --basetemp=.test-tmp"
markers = [
  "integration: requires an external service such as PostgreSQL",
]

[tool.ruff]
target-version = "py311"
line-length = 120
extend-exclude = ["data", ".test-tmp"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "llm-gateway"
version = "0.5.0"
description = "OpenAI-compatible, quota-aware LLM routing gateway"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.5,<3",
  "PyYAML>=6,<7",
  "uvicorn[standard]>=0.30,<1",
  "asyncpg>=0.30,<1",
  "redis>=5,<7",
]

[project.optional-dependencies]
dev = [
  "build>=1.2,<2",
  "pytest>=8,<9",
  "pytest-asyncio>=0.24,<1",
  "ruff>=0.8,<1",
]

[project.scripts]
llm-gateway = "llm_gateway.cli:main"
llm-gateway-admin = "llm_gateway.admin_cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/llm_gateway"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
addopts = "--strict-markers --basetemp=.test-tmp"
markers = [
  "integration: requires an external service such as PostgreSQL",
]

[tool.ruff]
target-version = "py311"
line-length = 120
extend-exclude = ["data", ".test-tmp"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]


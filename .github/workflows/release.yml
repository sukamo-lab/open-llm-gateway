name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install verified release toolchain
        run: python -m pip install --requirement requirements/release.txt
      - name: Install project verification dependencies
        run: python -m pip install -e ".[dev]"
      - name: Validate version, tag, changelog, and feature evidence
        run: python scripts/release_check.py metadata --tag "$GITHUB_REF_NAME"
      - name: Re-run release safety checks
        run: |
          python -m pytest -m "not integration" -q
          python -m ruff check src tests scripts
      - name: Set reproducible build timestamp
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --pretty=%ct)" >> "$GITHUB_ENV"
      - name: Build twice from the same source
        run: |
          python -m build --no-isolation --outdir dist-first
          python -m build --no-isolation --outdir dist-second
      - name: Require byte-for-byte reproducibility
        run: python scripts/release_check.py compare dist-first dist-second
      - name: Prepare release artifacts and checksums
        run: |
          mkdir dist
          cp dist-first/* dist/
          python scripts/release_check.py checksums dist dist/SHA256SUMS
      - name: Generate build provenance attestations
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "dist/*"
      - name: Keylessly sign packages
        uses: sigstore/gh-action-sigstore-python@790bc6befb9d733738f18d8f895854b453640ec9 # v3.5.0
        with:
          inputs: >-
            ./dist/*.whl
            ./dist/*.tar.gz
      - name: Upload immutable workflow artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: llm-gateway-${{ github.ref_name }}
          path: dist/*
          if-no-files-found: error
          retention-days: 90
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --generate-notes
